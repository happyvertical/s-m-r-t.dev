<!doctype html>
<!--
  Source card for static/og-image.png (the site-wide og:image that
  src/lib/components/SEO.svelte sets on every page). Nothing builds this file.
  To regenerate the PNG: open it in Chrome as a file:// URL, emulate a
  1200x630 viewport at device pixel ratio 1, wait for document.fonts.ready,
  and screenshot the viewport to static/og-image.png. Confirm with
  `sips -g pixelWidth -g pixelHeight static/og-image.png` (1200 x 630) and
  keep the file under 300 KB.

  The card is the dark (fire) front page of #361: og-map.png beside this file
  is a 1200x630 capture of `/` in the dark scheme after the sun has settled
  (build the site, `vite preview`, emulate prefers-color-scheme dark, wait
  ~3 s, screenshot). The page header and the "hover a node" hint are covered
  by the two strips here, which carry the wordmark and the three doors.
  Colours are the front page's fire tokens (src/routes/+page.svelte). The
  wordmark is the header's: lowercase, Gabarito 800, set tight (#396). The
  rest is the front page's JetBrains Mono. Both come from the one Google Fonts
  link below and fall back to system stacks, so wait for the fonts.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>og-image source card</title>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Gabarito:wght@800&family=JetBrains+Mono:wght@500;700&display=swap"
		/>
		<style>
			:root {
				--bg: #0a0604;
				--ink: #ffe9c4;
				--dim: #c28a4f;
				--line: #3a2412;
				--orange: #ff8c1a;
				--font-wordmark: 'Gabarito', 'Avenir Next', 'Helvetica Neue', sans-serif;
				--font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Monaco, Consolas, monospace;
			}
			html,
			body {
				margin: 0;
				background: var(--bg);
			}
			.card {
				position: relative;
				width: 1200px;
				height: 630px;
				overflow: hidden;
				background: var(--bg);
				font-family: var(--font-mono);
			}
			.card img.map {
				position: absolute;
				inset: 0;
				width: 1200px;
				height: 630px;
			}
			.strip {
				position: absolute;
				left: 0;
				right: 0;
				display: flex;
				align-items: center;
				background: var(--bg);
				padding: 0 28px;
			}
			.top {
				top: 0;
				height: 62px;
				gap: 14px;
				border-bottom: 1px solid var(--line);
			}
			.top .word {
				color: var(--ink);
				font-family: var(--font-wordmark);
				font-size: 38px;
				font-weight: 800;
				letter-spacing: -0.04em;
				line-height: 1;
			}
			.top .doors {
				margin-left: auto;
				color: var(--orange);
				font-size: 18px;
				font-weight: 700;
				letter-spacing: 0.22em;
			}
			.bottom {
				bottom: 0;
				height: 38px;
				justify-content: center;
				color: var(--dim);
				font-size: 14px;
				letter-spacing: 0.12em;
			}
		</style>
	</head>
	<body>
		<div class="card">
			<img class="map" src="og-map.png" alt="" width="1200" height="630" />
			<div class="strip top">
				<span class="word">smrt</span>
				<span class="doors">BUILD · FEATURES · DOCS</span>
			</div>
			<div class="strip bottom">The smrt application stack · MIT</div>
		</div>
	</body>
</html>

<!doctype html>
<!--
  Source card for static/og-image.png (the site-wide og:image that
  src/lib/components/SEO.svelte sets on every page). Nothing builds this file.
  To regenerate the PNG: open it in Chrome as a file:// URL, emulate a
  1200x630 viewport at device pixel ratio 1, wait for document.fonts.ready,
  and screenshot the viewport to static/og-image.png. Confirm with
  `sips -g pixelWidth -g pixelHeight static/og-image.png` (1200 x 630) and
  keep the file under 300 KB.

  Tokens are the site's light scheme: the fallback values of the --site-*
  variables in src/lib/styles/variables.css (paper, surface, ink, muted, line,
  accent). The mark is src/lib/assets/smrt-mark.svg inlined. The font is the
  smrt theme's self-hosted Inter (resolved from node_modules, so run
  pnpm install first) with the site's monospace stack for the wordmark, as
  Header.svelte's .brand span uses.

  og-frame.png beside this file is one frame of the build-a-boilerplate
  recording (screencast v3, planner-home.mp4 at 16.2 s): the Mechanic
  mock-up's "Sales by month" report with the assistant open, cropped to the
  stat tiles, the chart and the assistant's reply, cursor removed.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>og-image source card</title>
		<style>
			@font-face {
				font-family: 'Inter';
				font-style: normal;
				font-weight: 100 900;
				src: url('../node_modules/@happyvertical/smrt-ui/dist/themes/fonts/inter-latin.woff2')
					format('woff2');
			}
			:root {
				--paper: #edeff2;
				--surface: #ffffff;
				--ink: #14171c;
				--muted: #5b6470;
				--line: #dfe3e8;
				--accent: #e35d12;
				--accent-soft: #ffe6d4;
				--font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
				--font-mono: ui-monospace, 'SF Mono', Monaco, 'Cascadia Code', Consolas, monospace;
			}
			html,
			body {
				margin: 0;
				background: var(--paper);
			}
			.card {
				position: relative;
				width: 1200px;
				height: 630px;
				overflow: hidden;
				box-sizing: border-box;
				padding: 60px 84px 0;
				color: var(--ink);
				font-family: var(--font-sans);
				background:
					radial-gradient(720px 420px at 100% 0%, rgba(227, 93, 18, 0.1), transparent 70%),
					var(--paper);
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 14px;
			}
			.brand svg {
				width: 52px;
				height: 52px;
			}
			.brand span {
				font-family: var(--font-mono);
				font-size: 30px;
				font-weight: 800;
				letter-spacing: -0.045em;
			}
			h1 {
				margin: 26px 0 0;
				white-space: nowrap;
				font-size: 68px;
				font-weight: 680;
				letter-spacing: -0.045em;
				line-height: 1.04;
			}
			.sub {
				margin: 14px 0 0;
				color: var(--muted);
				font-size: 27px;
				font-weight: 400;
				letter-spacing: -0.01em;
				line-height: 1.3;
			}
			/*
       * The recording frame sits in a window that runs off the bottom edge.
       * It is the picture; the words above it carry the message, so it may be
       * cropped at thumbnail sizes without losing anything that has to read.
       */
			.window {
				position: absolute;
				left: 84px;
				right: 84px;
				top: 318px;
				border: 1px solid var(--line);
				border-bottom: 0;
				border-radius: 14px 14px 0 0;
				background: var(--surface);
				box-shadow:
					0 -1px 0 rgba(255, 255, 255, 0.8) inset,
					0 18px 48px rgba(20, 23, 28, 0.12);
				overflow: hidden;
			}
			.window .bar {
				display: flex;
				align-items: center;
				gap: 7px;
				height: 34px;
				padding: 0 14px;
				border-bottom: 1px solid var(--line);
				background: #f5f6f8;
			}
			.window .bar i {
				width: 10px;
				height: 10px;
				border-radius: 50%;
				background: var(--line);
			}
			.window .bar i:first-child {
				background: var(--accent);
			}
			.window .bar span {
				margin-left: 10px;
				color: var(--muted);
				font-family: var(--font-mono);
				font-size: 13px;
			}
			.window img {
				display: block;
				width: 100%;
				height: auto;
			}
		</style>
	</head>
	<body>
		<div class="card">
			<div class="brand">
				<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-hidden="true">
					<defs>
						<linearGradient
							id="flame"
							x1="26"
							y1="16"
							x2="101"
							y2="112"
							gradientUnits="userSpaceOnUse"
						>
							<stop stop-color="#f05b2b" />
							<stop offset="1" stop-color="#c9381e" />
						</linearGradient>
						<linearGradient
							id="heat"
							x1="51"
							y1="49"
							x2="72"
							y2="111"
							gradientUnits="userSpaceOnUse"
						>
							<stop stop-color="#ffd33d" />
							<stop offset="1" stop-color="#f2a817" />
						</linearGradient>
					</defs>
					<path
						fill="url(#flame)"
						d="M64 5c-3 18-15 26-13 43-9-5-13-13-13-22C20 43 15 62 22 82c7 22 23 37 42 41 22-4 39-21 43-43 3-17-3-32-18-45 2 11 0 18-6 25C84 36 75 19 64 5Z"
					/>
					<path
						fill="url(#heat)"
						d="M64 45c-2 15-14 22-13 38-5-4-8-9-9-15-7 10-8 20-4 30 5 12 14 20 26 23 13-3 23-12 27-25 3-11 0-20-8-29 0 7-2 12-6 16 1-16-5-27-13-38Z"
					/>
					<g
						fill="none"
						stroke="#ffe3ae"
						stroke-opacity="0.85"
						stroke-linecap="round"
						stroke-linejoin="round"
					>
						<path stroke-width="14" d="M7 63c12-4 27-5 43-1M78 62c16-4 31-3 43 1" />
						<rect x="12" y="58" width="46" height="35" rx="13" stroke-width="14" />
						<rect x="70" y="58" width="46" height="35" rx="13" stroke-width="14" />
						<path stroke-width="13" d="M57 66c5-4 9-4 14 0" />
					</g>
					<g fill="none" stroke="#33221b" stroke-linecap="round" stroke-linejoin="round">
						<path stroke-width="8" d="M7 63c12-4 27-5 43-1M78 62c16-4 31-3 43 1" />
						<rect x="12" y="58" width="46" height="35" rx="13" stroke-width="8" />
						<rect x="70" y="58" width="46" height="35" rx="13" stroke-width="8" />
						<path stroke-width="7" d="M57 66c5-4 9-4 14 0" />
					</g>
				</svg>
				<span>s-m-r-t</span>
			</div>
			<h1>The s-m-r-t application stack</h1>
			<p class="sub">
				Agentic building blocks for applications that people and agents use together.
			</p>
			<div class="window">
				<div class="bar"><i></i><i></i><i></i><span>Mechanic · Reports · Sales by month</span></div>
				<img src="og-frame.png" alt="" width="1760" height="620" />
			</div>
		</div>
	</body>
</html>

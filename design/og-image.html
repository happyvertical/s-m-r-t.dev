<!doctype html>
<!--
  Source card for static/og-image.png (the site-wide og:image that
  src/lib/components/SEO.svelte sets on every page). Nothing builds this file.
  To regenerate the PNG: open it in Chrome as a file:// URL, emulate a
  1200x630 viewport at device pixel ratio 1, wait for document.fonts.ready,
  and screenshot the viewport to static/og-image.png. Confirm with
  `sips -g pixelWidth -g pixelHeight static/og-image.png` (1200 x 630) and
  keep the file under 300 KB.

  The card is the landing page's hero (#397) on a solid pine ground: the
  wordmark, the headline with its two brass underlines, and the hero label.
  Colours are the site theme's (src/lib/themes/site-theme.ts): pine as a fill,
  white on it, brass for decoration. The wordmark is the header's: lowercase,
  Gabarito 800, set tight (#396). The headline is Gabarito 700 and the label
  JetBrains Mono, as on the page. All come from the one Google Fonts link
  below and fall back to system stacks, so wait for the fonts.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>og-image source card</title>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Gabarito:wght@700;800&family=JetBrains+Mono:wght@500&display=swap"
		/>
		<style>
			:root {
				--pine: #1d6a3c;
				--on-pine: #ffffff;
				--brass: #d4a017;
				--font-display: 'Gabarito', 'Avenir Next', 'Helvetica Neue', sans-serif;
				--font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Monaco, Consolas, monospace;
			}
			html,
			body {
				margin: 0;
				background: var(--pine);
			}
			.card {
				box-sizing: border-box;
				width: 1200px;
				height: 630px;
				display: flex;
				flex-direction: column;
				justify-content: space-between;
				padding: 64px 72px 60px;
				overflow: hidden;
				background: var(--pine);
				color: var(--on-pine);
			}
			.word {
				font-family: var(--font-display);
				font-size: 64px;
				font-weight: 800;
				letter-spacing: -0.04em;
				line-height: 1;
			}
			h1 {
				max-width: 980px;
				margin: 0;
				font-family: var(--font-display);
				font-size: 100px;
				font-weight: 700;
				letter-spacing: -0.03em;
				line-height: 1.04;
			}
			h1 em {
				font-style: normal;
				text-decoration: underline;
				text-decoration-color: var(--brass);
				text-decoration-thickness: 0.09em;
				text-underline-offset: 0.1em;
				text-decoration-skip-ink: none;
			}
			.foot {
				display: flex;
				align-items: center;
				gap: 20px;
				font-family: var(--font-mono);
				font-size: 24px;
				font-weight: 500;
				letter-spacing: 0.02em;
			}
			.foot::before {
				content: '';
				width: 56px;
				height: 8px;
				border-radius: 4px;
				background: var(--brass);
			}
		</style>
	</head>
	<body>
		<div class="card">
			<div class="word">smrt</div>
			<h1>Build <em>agentic software</em> for people <em>and agents</em>.</h1>
			<div class="foot">TypeScript framework · MIT licensed</div>
		</div>
	</body>
</html>

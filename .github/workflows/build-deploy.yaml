name: Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'static/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - 'svelte.config.js'
      - 'vite.config.ts'
      - '.github/workflows/build-deploy.yaml'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production
        default: 'staging'

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Determine smrt branch
        id: smrt-branch
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          # Check if the branch exists in the smrt repo, fall back to main
          if gh api "repos/happyvertical/smrt/branches/$BRANCH_NAME" --silent 2>/dev/null; then
            echo "ref=$BRANCH_NAME" >> $GITHUB_OUTPUT
          else
            echo "ref=main" >> $GITHUB_OUTPUT
          fi

      - name: Checkout smrt monorepo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: happyvertical/smrt
          ref: ${{ steps.smrt-branch.outputs.ref }}
          path: smrt
          token: ${{ secrets.GH_TOKEN }}

      - name: Checkout havesmrt.com
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: havesmrt.com
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          # No `cache: pnpm` here: on the self-hosted runners the Actions cache
          # backend can't resolve the pnpm store path ("Some specified paths were
          # not resolved"), which fails the step. The runners are persistent, so
          # the pnpm store survives between runs and an explicit cache isn't needed.
          # setup-node writes the auth token into the user `.npmrc` at runtime,
          # so pnpm can resolve `@happyvertical/*` packages from GitHub Packages
          # without needing a `${TOKEN}` substitution in the project `.npmrc`
          # (which Renovate's sandbox cannot resolve, leaving lockfile updates
          # silently broken — see the .npmrc comment).
          registry-url: 'https://npm.pkg.github.com'
          scope: '@happyvertical'

      - name: Install dependencies
        working-directory: havesmrt.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: havesmrt.com
        run: pnpm test

      - name: Build static site
        working-directory: havesmrt.com
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build
          path: havesmrt.com/build/
          retention-days: 7

  deploy-staging:
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    runs-on: self-hosted
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build
          path: build/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: us-west-2

      - name: Deploy to S3
        run: |
          aws s3 sync build/ s3://havesmrt-staging/ --delete --cache-control "public, max-age=3600"
          aws s3 cp build/_app/ s3://havesmrt-staging/_app/ --recursive --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E1OSZKW909MZLI --paths "/*"

  deploy-production:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    runs-on: self-hosted
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build
          path: build/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PRODUCTION }}
          aws-region: us-west-2

      - name: Deploy to S3
        run: |
          aws s3 sync build/ s3://havesmrt-production/ --delete --cache-control "public, max-age=3600"
          aws s3 cp build/_app/ s3://havesmrt-production/_app/ --recursive --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id EV2V4BTTHGGOV --paths "/*"

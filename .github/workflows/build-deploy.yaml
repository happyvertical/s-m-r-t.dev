name: Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'static/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - 'svelte.config.js'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/build-deploy.yaml'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production
        default: 'staging'

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # actions/checkout stays on v5 (node24, classic http.extraheader auth).
      # Do NOT bump to v6+: its includeIf.gitdir credential isolation fails to
      # authenticate on the self-hosted runners' nested workspace paths. The
      # renovate.json allowedVersions rule enforces this.
      - name: Checkout s-m-r-t.dev
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: s-m-r-t.dev
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          # The repository is checked out below the runner workspace. Read the
          # app manifest explicitly so stale root files on a self-hosted runner
          # cannot supply a second, conflicting pnpm version.
          package_json_file: s-m-r-t.dev/package.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Pinned to a major on purpose. `engines.node` is `>=24.18.0` and the
          # project `.npmrc` sets `engine-strict=true`, so the install enforces
          # the floor itself; feeding that unbounded range to setup-node via
          # `node-version-file` would let a deploy build silently change Node
          # major the day a runner image caches a newer one.
          node-version: '24'
          # No `cache: pnpm` here: the Actions cache backend can't resolve the
          # pnpm store path on the self-hosted runners this workflow used to run
          # on ("Some specified paths were not resolved"), which fails the step.
          #
          # No `registry-url`/`scope` either: the `@happyvertical/*` packages are
          # public on npmjs and the project `.npmrc` pins that registry, so the
          # install needs no authentication.

      - name: Install dependencies
        working-directory: s-m-r-t.dev
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: s-m-r-t.dev
        run: pnpm test

      - name: Typecheck
        working-directory: s-m-r-t.dev
        run: pnpm run check

      - name: Build static site
        working-directory: s-m-r-t.dev
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build
          path: s-m-r-t.dev/build/
          retention-days: 7

  deploy-staging:
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build
          path: build/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: us-west-2

      - name: Deploy to S3
        run: |
          aws s3 sync build/ s3://havesmrt-staging/ --delete --cache-control "public, max-age=3600"
          aws s3 cp build/_app/ s3://havesmrt-staging/_app/ --recursive --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E1OSZKW909MZLI --paths "/*"

  deploy-production:
    needs:
      - build
      - deploy-staging
    # Main is continuously deployed after staging succeeds. `always()` lets a
    # manual production dispatch proceed when the staging job is intentionally
    # skipped, while the explicit result checks still prevent unsafe promotion.
    if: >-
      always() &&
      needs.build.result == 'success' &&
      ((github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.deploy-staging.result == 'success') ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.environment == 'production'))
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build
          path: build/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PRODUCTION }}
          aws-region: us-west-2

      - name: Deploy to S3
        run: |
          aws s3 sync build/ s3://havesmrt-production/ --delete --cache-control "public, max-age=3600"
          aws s3 cp build/_app/ s3://havesmrt-production/_app/ --recursive --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id EV2V4BTTHGGOV --paths "/*"

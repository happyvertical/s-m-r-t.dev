name: Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'static/**'
      - 'package*.json'
      - 'svelte.config.js'
      - 'vite.config.ts'
      - '.github/workflows/build-deploy.yaml'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production
        default: 'staging'

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout smrt monorepo
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          repository: happyvertical/smrt
          ref: ${{ github.head_ref || github.ref_name }}
          path: smrt
          token: ${{ secrets.GH_TOKEN }}

      - name: Checkout havesmrt.com
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          path: havesmrt.com

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: smrt/pnpm-lock.yaml

      - name: Build smrt packages
        working-directory: smrt
        env:
          NPM_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install dependencies
        working-directory: havesmrt.com
        run: npm ci

      - name: Run tests
        working-directory: havesmrt.com
        run: npm test

      - name: Build static site
        working-directory: havesmrt.com
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: havesmrt.com/build/
          retention-days: 7

  deploy-staging:
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: us-west-2

      - name: Deploy to S3
        run: |
          aws s3 sync build/ s3://havesmrt-staging/ --delete --cache-control "public, max-age=3600"
          aws s3 cp build/_app/ s3://havesmrt-staging/_app/ --recursive --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E1OSZKW909MZLI --paths "/*"

  deploy-production:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PRODUCTION }}
          aws-region: us-west-2

      - name: Deploy to S3
        run: |
          aws s3 sync build/ s3://havesmrt-production/ --delete --cache-control "public, max-age=3600"
          aws s3 cp build/_app/ s3://havesmrt-production/_app/ --recursive --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id EV2V4BTTHGGOV --paths "/*"

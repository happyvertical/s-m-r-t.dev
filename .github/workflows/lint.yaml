name: Lint audit

# Reports when `pnpm run lint` — the validation command AGENTS.md documents but
# CI never ran — has broken on `main`.
#
# Deliberately NOT a gate, like the freshness audit next to it. It never runs on
# a pull request, is never a required check, and cannot block a merge; adding a
# required check to this public repository would change merge behaviour for human
# contributors and needs explicit confirmation first.
#
# It does report red, which is where it parts company with the freshness audit.
# That one stays green because a hash comparison is not qualified to reject
# hand-written prose. `prettier --check`, `eslint`, and `check:templates` are
# deterministic and AGENTS.md already requires them green, so the failing run
# attached to the offending commit is the whole report — no tracking issue is
# needed to make a deterministic, one-command fix actionable.
on:
  push:
    branches:
      - main
    # No `paths` filter, on purpose. `prettier --check .` reaches files
    # build-deploy.yaml's push filter does not list — `eslint.config.js`,
    # `renovate.json`, `.prettierrc`, and every root `*.md` among them — so
    # copying that filter here would leave them unwatched.
  workflow_dispatch:

permissions:
  contents: read

# No `concurrency` group, unlike the freshness audit. That one is a scheduled
# singleton that edits one shared tracking issue, so serialising it is the
# point. Here every push needs its own run: a group holds at most one pending
# run, and queueing a third push cancels the pending second one even with
# `cancel-in-progress: false`, which would silently skip a commit and land its
# regression on a later one — the exact misattribution this workflow exists to
# prevent.

jobs:
  lint:
    # Named so that it reads as advisory in the branch-protection check picker,
    # which offers any check seen in the last week. Selecting this one would hang
    # every pull request forever: it only ever runs on a push to main, so it
    # would never report a status on a PR head.
    name: lint (advisory, never a gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # actions/checkout stays on v5 to match the other workflows, which the
      # renovate.json allowedVersions rule enforces. Nothing here touches git
      # after checkout, so the token does not need to stay in .git/config.
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          # Pinned to a major, like the other workflows: `engines.node` plus
          # `engine-strict=true` enforce the real floor at install time.
          node-version: '24'

      # prettier, eslint, and the template checker all resolve out of the
      # installed tree. `--frozen-lockfile` keeps this honest about the tree the
      # repository actually committed. No credentials are needed — every
      # `@happyvertical/*` package is public on npmjs.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The log is teed to RUNNER_TEMP rather than the workspace so that nothing
      # this step writes can end up inside the tree the next run lints.
      - name: Run the documented lint command
        run: |
          set +e
          pnpm run lint 2>&1 | tee "$RUNNER_TEMP/lint.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              cat <<'HEADER'
          ## `pnpm run lint` is failing on `main`

          Reproduce locally with `pnpm run lint`. Prettier findings are fixed by
          `pnpm run format`; eslint and `check:templates` findings are not.

          ```
          HEADER
              cat "$RUNNER_TEMP/lint.log"
              printf '%s\n' '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
